server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	# SPA: qualquer rota que não seja um arquivo real cai no index.html
	# (o roteamento de verdade é feito pelo React Router no client).
	location / {
		try_files $uri $uri/ /index.html;
	}

	# Assets com hash no nome (Vite) podem ter cache longo com segurança.
	location /assets/ {
		try_files $uri =404;
		add_header Cache-Control "public, max-age=31536000, immutable";
	}
}
