services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER em .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD em .env.production}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB em .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - sentinel_net
    # Sem "ports": só acessível dentro da rede do compose. Nada além do
    # backend/worker precisa falar com o Postgres.

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?defina MINIO_ROOT_USER em .env.production}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD em .env.production}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - sentinel_net
    # Sem "ports": o Caddy fala com o MinIO pelo nome do serviço na rede
    # interna (reverse_proxy minio:9000). O console (9001) fica fechado —
    # abra com um túnel SSH se precisar dele pontualmente (ver tutorial).

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-sentinel-assets}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$MINIO_BUCKET &&
      mc anonymous set none local/$$MINIO_BUCKET
      "
    restart: "no"
    networks:
      - sentinel_net

  # Único componente que fala com o mundo externo (o NPM da VM encaminha
  # pra cá). Fica no compose "shared" porque a troca de slot blue/green é
  # feita por ELE — reapontar o upstream e recriar só este container — sem
  # nunca duplicar Postgres/MinIO. Ver deploy/prod-deploy.sh.
  caddy:
    image: caddy:2-alpine
    volumes:
      - ./caddy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:?defina DOMAIN em .env.production}
      MINIO_DOMAIN: ${MINIO_DOMAIN}
    env_file:
      # BACKEND_UPSTREAM / FRONTEND_UPSTREAM (ex.: backend-blue:8000). Gerado
      # e mantido por deploy/prod-deploy.sh — nunca commitado (ver
      # deploy/active-slot.env.example para o formato). required:false
      # porque no primeiro `up` do servidor esse arquivo ainda não existe —
      # o primeiro deploy real (deploy/prod-deploy.sh) que o cria.
      - path: ./deploy/active-slot.env
        required: false
    networks:
      - sentinel_net
    ports:
      # TLS é terminado pelo Nginx Proxy Manager já existente na VM (usa
      # 80/443 em 177.72.80.11). Este Caddy só escuta HTTP puro numa porta
      # interna, que o NPM encaminha via proxy host.
      - "8300:80"
    restart: unless-stopped

networks:
  sentinel_net:
    external: true

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:
