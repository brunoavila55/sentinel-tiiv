services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER em .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD em .env.production}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB em .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # Sem "ports": só acessível dentro da rede do compose. Nada além do
    # backend/worker precisa falar com o Postgres.

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?defina MINIO_ROOT_USER em .env.production}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD em .env.production}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # Sem "ports": o Caddy fala com o MinIO pelo nome do serviço na rede
    # interna (reverse_proxy minio:9000). O console (9001) fica fechado —
    # abra com um túnel SSH se precisar dele pontualmente (ver tutorial).

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-sentinel-assets}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$MINIO_BUCKET &&
      mc anonymous set none local/$$MINIO_BUCKET
      "
    restart: "no"

  backend:
    build: ./backend
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_DOMAIN:?defina MINIO_DOMAIN em .env.production}
      MINIO_USE_SSL: "false"
      MINIO_PUBLIC_USE_SSL: "true"
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-sentinel-assets}
      CORS_ORIGINS: https://${DOMAIN}
      PUBLIC_APP_URL: https://${DOMAIN}
      SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY em .env.production, gerado com python3 -c 'import secrets; print(secrets.token_urlsafe(32))'}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # Sem bind mount: a imagem já contém o código; sem "ports": só o Caddy
    # fala com o backend, pelo nome do serviço.

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    depends_on:
      - backend
    restart: unless-stopped
    # Sem bind mount, sem "ports": build estático (nginx na porta 80
    # interna), só o Caddy fala com ele.

  caddy:
    image: caddy:2-alpine
    volumes:
      - ./caddy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:?defina DOMAIN em .env.production}
      MINIO_DOMAIN: ${MINIO_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?defina ACME_EMAIL em .env.production (usado pelo Let's Encrypt)}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:
