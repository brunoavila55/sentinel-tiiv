name: Rollback Production

# Sem gatilho automático de propósito — rollback é sempre uma decisão
# humana explícita, disparada em Actions → Rollback Production → Run
# workflow.
on:
  workflow_dispatch: {}

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Rollback via SSH (volta pro slot anterior)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          script: |
            set -e
            cd /root/sentinel-tiiv
            bash deploy/prod-rollback.sh
