name: Rollback Production

# Sem gatilho automático de propósito — rollback é sempre uma decisão
# humana explícita, disparada em Actions → Rollback Production → Run
# workflow.
on:
  workflow_dispatch: {}

jobs:
  rollback:
    runs-on: sentinel-deploy
    environment: production
    steps:
      - name: Rollback (volta pro slot anterior)
        run: bash /home/deploy/apps/sentinel-tiiv/deploy/prod-rollback.sh
