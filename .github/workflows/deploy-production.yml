name: Deploy Production

on:
  push:
    branches: [master]

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    # Runner self-hosted instalado dentro do próprio VM de produção — o
    # firewall do servidor bloqueia SSH de fora (só libera uma faixa de IP
    # conhecida), então em vez do GitHub tentar entrar, o agente roda local
    # e puxa trabalho pra fora. Ver README, seção CI/CD.
    runs-on: sentinel-deploy
    # Ambiente "production" do GitHub: se configurado com required
    # reviewers em Settings → Environments, o deploy pausa esperando
    # aprovação manual antes de rodar o script abaixo. Opcional, mas
    # recomendado pra produção.
    environment: production
    steps:
      - name: Deploy (blue-green)
        run: bash /home/deploy/apps/sentinel-tiiv/deploy/prod-deploy.sh
