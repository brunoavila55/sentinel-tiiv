name: Deploy Staging

on:
  push:
    branches: [staging]

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          # /root/sentinel-tiiv-staging: checkout dedicado ao branch
          # staging no servidor (ver README, seção CI/CD). Se o caminho
          # for outro na sua VM, ajuste aqui.
          script: |
            set -e
            cd /root/sentinel-tiiv-staging
            bash deploy/staging-deploy.sh
