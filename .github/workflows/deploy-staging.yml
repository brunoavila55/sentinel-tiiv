name: Deploy Staging

on:
  push:
    branches: [staging]

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    # Runner self-hosted instalado dentro do próprio VM de produção — o
    # firewall do servidor bloqueia SSH de fora (só libera uma faixa de IP
    # conhecida), então em vez do GitHub tentar entrar, o agente roda local
    # e puxa trabalho pra fora. Ver README, seção CI/CD.
    runs-on: sentinel-deploy
    steps:
      - name: Deploy staging
        run: bash /home/deploy/apps/sentinel-tiiv-staging/deploy/staging-deploy.sh
